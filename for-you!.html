<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Question</title>

<style>
  * {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    height: 100svh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("https://media1.tenor.com/m/SurNy3g5Z_YAAAAd/sua-alnst.gif") center/cover no-repeat;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.35);
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(90vw, 380px);
    padding: 32px 24px;
    border-radius: 24px;
    text-align: center;
    color: white;
    background: rgba(255,154,213,0.25);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 32px rgba(199,125,255,0.5);
    transition: all 0.8s ease;
  }

  h1 {
    font-size: clamp(20px, 5vw, 26px);
    margin-bottom: 24px;
  }

  .buttons {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 16px;
    height: 60px;
  }

  button {
    border: none;
    padding: 12px 26px;
    font-size: 16px;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.3s ease;
    touch-action: manipulation;
  }

  #yesBtn {
    background: linear-gradient(135deg,#9d4edd,#ff70a6);
    color: white;
  }

  #noBtn {
    background: linear-gradient(135deg,#ff4d9d,#ff85c2);
    color: white;
    position: absolute;
  }

  .full-yes {
    position: fixed;
    inset: 0;
    border-radius: 0;
    font-size: clamp(28px, 8vw, 44px);
    z-index: 10;
  }

  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(1); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-120svh) scale(1.6); }
  }

  .sparkle {
    position: absolute;
    font-size: 14px;
    animation: sparkle 1.2s ease-out forwards;
    pointer-events: none;
  }

  @keyframes sparkle {
    from { opacity: 1; transform: scale(0); }
    to { opacity: 0; transform: scale(2) translateY(-20px); }
  }

  .floating-text {
    position: fixed;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    animation: drift 4s ease-out forwards;
    pointer-events: none;
    text-align: center;
  }

  @keyframes drift {
    from { opacity: 0; transform: translateY(20px); }
    20% { opacity: 1; }
    to { opacity: 0; transform: translateY(-120px); }
  }
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="question">will you be the sua to my mizi?</h1>
  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const question = document.getElementById("question");
  const card = document.getElementById("card");

  let yesScale = 1;
  let answered = false;
  let mood = "heart";

  function dodgeNo() {
    const x = Math.random() * 220 - 110;
    const y = Math.random() * 140 - 70;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }

  noBtn.addEventListener("mouseenter", dodgeNo);
  noBtn.addEventListener("touchstart", dodgeNo);

  noBtn.addEventListener("click", () => {
    yesScale += 0.3;
    yesBtn.style.transform = `scale(${yesScale})`;
    if (yesScale >= 3.8) {
      yesBtn.classList.add("full-yes");
      yesBtn.textContent = "YES";
    }
  });

  function spawnHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = mood === "heart" ? "💗" : mood === "broken" ? "💔" : "🥀";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = Math.random() * 18 + 16 + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }
  setInterval(spawnHeart, 500);

  setTimeout(() => { if (!answered) mood = "broken"; }, 8000);
  setTimeout(() => { if (!answered) mood = "rose"; }, 14000);

  const sadTexts = ["SAY YES", "do u hate me"];
  const happyTexts = ["YIPPEE", "MWAH I LOVE YOU"];

  function floatingText(text) {
    const t = document.createElement("div");
    t.className = "floating-text";
    t.textContent = text;
    t.style.left = Math.random() * 80 + "vw";
    t.style.top = Math.random() * 70 + "vh";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  setInterval(() => {
    if (!answered && mood !== "heart") {
      floatingText(sadTexts[Math.floor(Math.random() * sadTexts.length)]);
    }
  }, 3500);

  setInterval(() => {
    if (answered) return;
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = "✨";
    const r = yesBtn.getBoundingClientRect();
    s.style.left = r.left + Math.random() * r.width + "px";
    s.style.top = r.top + Math.random() * r.height + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }, 700);

  yesBtn.addEventListener("click", () => {
    answered = true;
    mood = "heart";
    question.textContent = "i-is that a yes?...";

    card.style.background = "rgba(58,134,255,0.25)";
    card.style.boxShadow = "0 0 36px rgba(131,56,236,0.6)";

    document.body.style.background =
      'url("https://www.gifcen.com/wp-content/uploads/2024/05/satoru-gojo-gif-12.gif") center/cover no-repeat';

    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    setInterval(() => {
      floatingText(happyTexts[Math.floor(Math.random() * happyTexts.length)]);
    }, 2500);
  });
</script>

</body>
</html>
